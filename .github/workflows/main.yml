الاسم: ويندوز RDP عبر Ngrok تشغيل: [دفع] الوظائف: إعداد بروتوكول سطح المكتب البعيد (rdp-setup): يعمل على: أحدث إصدار من نظام التشغيل ويندوز مهلة الدقائق: 360 # الحد الأقصى لوقت التشغيل المجاني على GitHub هو 6 ساعات خطوات: - الاسم: قم بتنزيل واستخراج Ngrok تشغيل: | Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip" -OutFile ngrok.zip Expand-Archive ngrok.zip -DestinationPath "$env:USERPROFILE" إزالة العنصر ngrok.zip Copy-Item "$env:USERPROFILE\ngrok.exe" "$env:GITHUB_WORKSPACE" - الاسم: مصادقة Ngrok تشغيل: | $ErrorActionPreference = "إيقاف" .\ngrok.exe authtoken "${{ secrets.NGROK_AUTH_TOKEN }}" - الاسم: تفعيل بروتوكول سطح المكتب البعيد (RDP) وجدار الحماية تشغيل: | Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 Enable-NetFirewallRule -DisplayGroup "Remote Desktop" إنشاء قاعدة جدار حماية جديدة للشبكة - الاسم المعروض "السماح ببروتوكول سطح المكتب البعيد عبر Ngrok" - الاتجاه وارد - الإجراء السماح - البروتوكول TCP - المنفذ المحلي 3389 - الاسم: إنشاء مستخدم مسؤول تشغيل: | net user kamel007 Kamel@123 /add net localgroup administrators kamel007 /add - الاسم: بدء نفق Ngrok تشغيل: | بدء العملية - مسار الملف "$pwd\ngrok.exe" - قائمة الوسائط "tcp 3389 --log=stdout" - عدم فتح نافذة جديدة - إعادة توجيه الإخراج القياسي ngrok.log $tunnelUrl = $null $timeout = 60 بينما ($timeout -gt 0 -and -not $tunnelUrl) { بدء وضع السكون - 5 ثوانٍ $timeout -= 5 يحاول { $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop $tunnelUrl = $response.tunnels[0].public_url -replace "tcp://", "" } يمسك { $logContent = Get-Content ngrok.log -ErrorAction SilentlyContinue $tunnelUrl = $logContent | Select-String -Pattern "tcp://([a-zA-Z0-9\.\-]+:\d+)" | ForEach-Object { $_.Matches.Groups[1].Value } } } إذا لم يكن $tunnelUrl موجودًا { Write-Output "::error::Ngrok tunnel could not created" المخرج 1 } Write-Output "============================================" Write-Output "|| âœ… تفاصيل اتصال RDP ||" Write-Output "============================================" Write-Output "العنوان: $tunnelUrl" Write-Output "اسم المستخدم: kamel007" Write-Output "Password: Kamel@123" Write-Output "--------------------------------------------" Write-Output "التعليمات:" Write-Output "1. اضغط على مفتاحي Win + R، واكتب 'mstsc' ثم اضغط على مفتاح الإدخال Enter" Write-Output "2. الاتصال بـ: $tunnelUrl" Write-Output "3. استخدم بيانات الاعتماد أعلاه" Write-Output "============================================" بينما ($صحيح) { ابدأ-النوم -ثواني 300 } - الاسم: تنظيف نجروك إذا: دائماً() تشغيل: | أوقف العملية "ngrok" بالقوة مع تجاهل الأخطاء.
